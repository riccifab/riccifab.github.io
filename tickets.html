<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neurotech – PI Ticketing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="tickets.css" />
</head>

<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1>PI Ticketing</h1>
        <small>Requests → triage → delivery. Email/password (Firebase) + allowlist.</small>
      </div>

      <div class="top-actions">
        <a class="pill-link" href="index.html">← Home</a>
        <div id="sessionPill" class="pill">
          <span class="pill-dot" id="pillDot"></span>
          <span id="pillText">Signed out</span>
        </div>
      </div>
    </header>

    <!-- LOGIN -->
    <section id="authCard" class="card">
      <h2>Access</h2>
      <p>
        Sign in with IIT email + password (created by admin in Firebase Auth).
        Your email must exist in Firestore <code>allowlist/{email}</code>.
      </p>

      <div class="grid2">
        <label>
          Email
          <input id="loginEmail" type="email" placeholder="name.surname@iit.it" autocomplete="username" />
        </label>
        <label>
          Password
          <input id="loginPass" type="password" placeholder="password" autocomplete="current-password" />
