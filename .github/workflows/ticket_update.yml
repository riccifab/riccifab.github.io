name: ticket-update-notify

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout bot-state
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: bot-state
          fetch-depth: 1

      - name: Prepare state
        run: |
          mkdir -p state
          # copia i file dal branch bot-state se esistono
          if [ -d "bot-state/state" ]; then
            cp -f bot-state/state/last_run_updates.json state/last_run_updates.json || true
            cp -f bot-state/state/ticket_snapshots.json state/ticket_snapshots.json || true
          fi
          # fallback se non esistono (prima esecuzione)
          test -f state/last_run_updates.json || echo '{"last_run":"2020-01-01T00:00:00+00:00"}' > state/last_run_updates.json
          test -f state/ticket_snapshots.json || echo '{}' > state/ticket_snapshots.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run ticket update notifier
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          # opzionali:
          # TICKETS_COLLECTION: tickets
          # STATE_DIR: state
          # DEBUG: "1"
        run: |
          python scripts/ticket_update.py

      - name: Persist state back to bot-state
        run: |
          mkdir -p bot-state/state
          cp -f state/last_run_updates.json bot-state/state/last_run_updates.json
          cp -f state/ticket_snapshots.json bot-state/state/ticket_snapshots.json

          cd bot-state
          git config user.name "ticket-bot"
          git config user.email "ticket-bot@users.noreply.github.com"
          git add state/last_run_updates.json state/ticket_snapshots.json
          git commit -m "Update ticket update notifier state" || echo "No changes"
          git push origin bot-state