name: ticket-update-notify

on:
  schedule:
    - cron: "*/5 * * * *"   # ogni 5 minuti
  workflow_dispatch:

concurrency:
  group: bot-state-writers
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout bot-state
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: bot-state
          fetch-depth: 1

      - name: Prepare state
        run: |
          mkdir -p state
          # copia i file dal branch bot-state se esistono
          if [ -d "bot-state/state" ]; then
            cp -f bot-state/state/last_run_updates.json state/last_run_updates.json || true
            cp -f bot-state/state/ticket_snapshots.json state/ticket_snapshots.json || true
          fi
          # fallback se non esistono (prima esecuzione)
          test -f state/last_run_updates.json || echo '{"last_run":"2020-01-01T00:00:00+00:00"}' > state/last_run_updates.json
          test -f state/ticket_snapshots.json || echo '{}' > state/ticket_snapshots.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run ticket update notifier
        id: notifier
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_CC: fabio.ricci@iit.it
          SITE_URL: ${{ vars.SITE_URL }}
          # opzionali:
          # TICKETS_COLLECTION: tickets
          # STATE_DIR: state
          # DEBUG: "1"
        run: |
          python scripts/ticket_update.py

      - name: Persist state back to bot-state
        run: |
          git -C bot-state config user.name "ticket-bot"
          git -C bot-state config user.email "ticket-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git -C bot-state fetch origin bot-state
            git -C bot-state reset --hard origin/bot-state

            python scripts/merge_bot_state.py --source-dir state --target-dir bot-state/state

            git -C bot-state add state/last_run_updates.json state/ticket_snapshots.json
            git -C bot-state commit -m "Update ticket update notifier state" || echo "No changes"
            git -C bot-state push origin HEAD:bot-state && break

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push bot-state after ${attempt} attempts" >&2
              exit 1
            fi

            sleep 2
          done

      - name: Fail when a notification could not be delivered
        if: steps.notifier.outcome == 'failure'
        run: exit 1
